# 推送 v<版本> tag 时构建纯大厅免安装包（只内置五子棋和井字棋）、拆分自动更新包、签名清单并发布 GitHub Release。
# 诡镇奇谈等游戏各自发布，玩家从大厅的游戏商店安装，所以这里不签出游戏子模块。
# 需要的仓库 Secret：
#   BOARDGAME_UPDATE_PRIVATE_KEY  更新签名私钥（tools/release/keygen.mjs 生成）
# 可选的 Gitee 同步（见 docs/updates.md）：仓库变量 GITEE_REPO（如 owner/boardgame-hall-ai）+ Secret GITEE_TOKEN
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check tag matches package.json
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Build hall-only portable package
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/build-windows.ps1 -HallOnly
      - name: Split update packages
        shell: bash
        run: node tools/release/pack-update.mjs dist/BoardgameHall-Lite-Windows-x64-*/ --app --out=dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/release/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build hall-only portable packages
        run: node tools/build-macos.mjs --arch=all --hall-only
      - name: Split update packages
        run: node tools/release/pack-update.mjs dist/BoardgameHall-Lite-macOS-*/ --out=dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/release/*

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: dist/release
          merge-multiple: true
      - name: Release notes from tag
        run: |
          git fetch --depth=1 origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > dist/notes.txt
      - name: Sign update manifest
        env:
          BOARDGAME_UPDATE_PRIVATE_KEY: ${{ secrets.BOARDGAME_UPDATE_PRIVATE_KEY }}
        run: node tools/release/make-manifest.mjs dist/release --tag="$GITHUB_REF_NAME" --notes-file=dist/notes.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # 重跑时 Release 已存在：改用已发布的附件，保证 Gitee 与 GitHub 上的文件一致。
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            rm -rf dist/release && gh release download "$GITHUB_REF_NAME" -D dist/release
          else
            gh release create "$GITHUB_REF_NAME" dist/release/* --title "桌游大厅 $GITHUB_REF_NAME" --notes-file dist/notes.txt
          fi
      - name: Mirror release to Gitee
        if: ${{ vars.GITEE_REPO != '' }}
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: node tools/release/gitee.mjs release dist/release --repo="${{ vars.GITEE_REPO }}" --tag="$GITHUB_REF_NAME" --title="桌游大厅 $GITHUB_REF_NAME" --notes-file=dist/notes.txt
