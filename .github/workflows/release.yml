# 推送 v<版本> tag 时构建免安装包、拆分自动更新包、签名清单并发布 GitHub Release。
# 需要的仓库 Secret：
#   BOARDGAME_UPDATE_PRIVATE_KEY  更新签名私钥（tools/release/keygen.mjs 生成）
#   SUBMODULE_TOKEN               可选；诡镇子模块为私有仓库时，提供有读取权限的 token
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check tag matches package.json
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Build portable package
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/build-windows.ps1 -SkipAssets
      - name: Split update packages
        shell: bash
        run: node tools/release/pack-update.mjs dist/BoardgameHall-Windows-x64-*/ --app --out=dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/release/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build portable packages
        run: node tools/build-macos.mjs --arch=all
      - name: Split update packages
        run: node tools/release/pack-update.mjs dist/BoardgameHall-macOS-*/ --out=dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/release/*

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: dist/release
          merge-multiple: true
      - name: Release notes from tag
        run: |
          git fetch --depth=1 origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > dist/notes.txt
      - name: Sign update manifest
        env:
          BOARDGAME_UPDATE_PRIVATE_KEY: ${{ secrets.BOARDGAME_UPDATE_PRIVATE_KEY }}
        run: node tools/release/make-manifest.mjs dist/release --tag="$GITHUB_REF_NAME" --notes-file=dist/notes.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/release/* --title "桌游大厅 $GITHUB_REF_NAME" --notes-file dist/notes.txt
